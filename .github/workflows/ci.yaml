name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: backend_builder
          POSTGRES_PASSWORD: backend_builder
          POSTGRES_DB: backend_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_builder"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --locked

      - name: End-to-end against the compose stack
        run: uv run pytest -m e2e apps/shop/tests/e2e -q -p no:cacheprovider

      - name: Stack logs on failure
        if: failure()
        run: COMPOSE_PROJECT_NAME=backend-builder-e2e docker compose --profile shop logs --no-log-prefix || true
