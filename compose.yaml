# Local services.
#
#   docker compose up -d                      Postgres only, for tests and `backend-builder serve`
#   docker compose --profile shop up --build  the whole shop: migrate, api, worker, scheduler
#   docker compose --profile finance up --build  the finance poller: migrate, worker, scheduler, admin
#
# The test harness creates and drops a database per test on the Postgres
# service. The shop profile is what the end-to-end suite brings up.

x-shop: &shop
  build:
    context: .
    args:
      APP: shop
  image: backend-builder-shop:local
  profiles: [shop]
  environment:
    RUNTIME_ENV: ${RUNTIME_ENV:-prod}
    BACKEND_BUILDER_DATABASE_URL: postgresql://backend_builder:backend_builder@postgres:5432/backend_builder
    BACKEND_BUILDER_LOG_LEVEL: ${BACKEND_BUILDER_LOG_LEVEL:-INFO}
    BACKEND_BUILDER_OUTBOX_POLL_SECONDS: ${BACKEND_BUILDER_OUTBOX_POLL_SECONDS:-1}
    BACKEND_BUILDER_OUTBOX_MAX_ATTEMPTS: ${BACKEND_BUILDER_OUTBOX_MAX_ATTEMPTS:-5}
    BACKEND_BUILDER_SCHEDULER_TICK_SECONDS: ${BACKEND_BUILDER_SCHEDULER_TICK_SECONDS:-15}
    BACKEND_BUILDER_METRICS_PORT: "9100"
    SECRET_NOTIFY_API_KEY: ${SECRET_NOTIFY_API_KEY:-local-notify-key-0000}

x-finance: &finance
  build:
    context: .
    args:
      APP: finance
  image: backend-builder-finance:local
  profiles: [finance]
  environment:
    RUNTIME_ENV: ${RUNTIME_ENV:-prod}
    BACKEND_BUILDER_DATABASE_URL: postgresql://backend_builder:backend_builder@postgres:5432/finance
    BACKEND_BUILDER_LOG_LEVEL: ${BACKEND_BUILDER_LOG_LEVEL:-INFO}
    BACKEND_BUILDER_METRICS_PORT: "9100"
    XDG_DATA_HOME: /data
    FINANCE_HF_REPO: ${FINANCE_HF_REPO:-shr22avan/finance-data}
    SECRET_HF_TOKEN: ${SECRET_HF_TOKEN:-}
  volumes:
    - ${FINANCE_MIRROR_HOME:-./data}:/data

services:
  postgres:
    image: postgres:17
    restart: unless-stopped          # the one Postgres on a host; every app has its own database in it
    environment:
      POSTGRES_USER: backend_builder
      POSTGRES_PASSWORD: backend_builder
      POSTGRES_DB: backend_builder
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./compose/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    # Memory: a floor, not a ceiling. Postgres is small here (tens of MB); the apps' fits and row
    # builds are what fill the box, and under pressure the kernel must kill one of those, not a
    # Postgres backend (a lost backend restarts the whole server and drops every connection).
    # mem_reservation is a soft guarantee; oom_score_adj makes it the last candidate for the killer;
    # shm_size lifts Docker's 64 MB /dev/shm, which parallel queries on big tables outgrow.
    mem_reservation: 1g
    oom_score_adj: -900
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_builder"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    <<: *shop
    command: ["migrate", "shop"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *shop
    command: ["serve", "shop", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
      - "${API_METRICS_PORT:-9100}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    <<: *shop
    command: ["worker", "shop"]
    ports:
      - "${WORKER_METRICS_PORT:-9101}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/health').status == 200 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  admin:
    <<: *shop
    command: ["admin", "shop", "--host", "0.0.0.0"]
    ports:
      - "${ADMIN_PORT:-9200}:9200"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9200/health').status == 200 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  scheduler:
    <<: *shop
    command: ["scheduler", "shop"]
    ports:
      - "${SCHEDULER_METRICS_PORT:-9102}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/health').status == 200 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  finance-migrate:
    <<: *finance
    command: ["migrate", "finance"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  finance-worker:
    <<: *finance
    command: ["worker", "finance"]
    ports:
      - "${FINANCE_WORKER_METRICS_PORT:-9111}:9100"
    depends_on:
      finance-migrate:
        condition: service_completed_successfully

  finance-scheduler:
    <<: *finance
    command: ["scheduler", "finance"]
    ports:
      - "${FINANCE_SCHEDULER_METRICS_PORT:-9112}:9100"
    depends_on:
      finance-migrate:
        condition: service_completed_successfully

  finance-admin:
    <<: *finance
    command: ["admin", "finance", "--host", "0.0.0.0"]
    ports:
      - "${FINANCE_ADMIN_PORT:-9210}:9200"
    depends_on:
      finance-migrate:
        condition: service_completed_successfully

volumes:
  postgres:
