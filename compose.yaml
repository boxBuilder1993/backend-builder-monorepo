# Local services. `docker compose up -d` starts Postgres for tests and
# development; the test harness creates and drops a database per test on it.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: backend_builder
      POSTGRES_PASSWORD: backend_builder
      POSTGRES_DB: backend_builder
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_builder"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres:
