[project]
name = "finance"
version = "0.1.0"
description = "Market-data poller: NSE, MCX, US equities, Kite minute bars, published to a private Hugging Face store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "backend-builder",
    "huggingface-hub>=2.2.0",
    "requests>=2.32",
    "curl-cffi>=0.10",
    "polars>=1.30,<2",
    "yfinance>=0.2",
    "pandas>=2",
    "kiteconnect>=5.0",
    "duckdb>=1.1",
    "xgboost>=3.0,<3.3",  # 3.3+ wheels need a newer CUDA driver than the GTX 1080 box has (550, CUDA 12.4)
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "numpy>=2",
    "pyarrow>=18",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
backend-builder = { workspace = true }
