[project]
name = "backend-builder-monorepo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/shop",
]

[tool.uv.sources]
backend-builder-testing = { workspace = true }

[dependency-groups]
dev = [
    "backend-builder-testing",
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-croniter>=6.2.4.20261006",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["packages", "apps"]
strict = ["packages", "apps"]
exclude = ["**/migrations/versions"]
pythonVersion = "3.13"
