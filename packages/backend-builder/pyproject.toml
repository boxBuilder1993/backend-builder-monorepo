[project]
name = "backend-builder"
version = "0.1.0"
description = "Reactive business-logic runtime over PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.8",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend-builder = "backend_builder.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
