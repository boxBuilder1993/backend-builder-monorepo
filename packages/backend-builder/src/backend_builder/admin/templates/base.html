<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ app.name }} admin{% if title %} · {{ title }}{% endif %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#1b1f23; --muted:#6a737d; --line:#e1e4e8; --ok:#1a7f37; --bad:#b42318; --warn:#9a6700; --bg:#fff; --card:#f6f8fa; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; gap:20px; align-items:center; padding:12px 24px; border-bottom:1px solid var(--line); }
  header .brand { font-weight:600; }
  header a { color:var(--fg); text-decoration:none; }
  header nav a { margin-right:14px; color:var(--muted); }
  header nav a.active { color:var(--fg); font-weight:600; }
  main { padding:20px 24px; max-width:1200px; }
  h1 { font-size:20px; margin:0 0 16px; } h2 { font-size:15px; margin:24px 0 8px; }
  table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  code, pre { font:12px/1.5 ui-monospace, monospace; } pre { background:var(--card); padding:10px; overflow:auto; border-radius:6px; }
  .ok { color:var(--ok); } .error, .timeout, .dead { color:var(--bad); } .muted { color:var(--muted); }
  .cards { display:flex; gap:12px; flex-wrap:wrap; } .card { background:var(--card); padding:12px 16px; border-radius:8px; min-width:140px; }
  .card .n { font-size:22px; font-weight:600; } .card .l { color:var(--muted); font-size:12px; }
  form.inline { display:inline; } button { font:inherit; padding:4px 10px; border:1px solid var(--line); background:var(--card); border-radius:6px; cursor:pointer; }
  input, select { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; }
  .tree td.name { white-space:nowrap; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">{{ app.name }}</a>
  <nav>
    {% for href, label in [("/", "Overview"), ("/graph", "Graph"), ("/runs", "Runs"), ("/outbox", "Outbox"), ("/schedules", "Schedules")] %}
      <a href="{{ href }}" class="{{ 'active' if request.url.path == href or (href != '/' and request.url.path.startswith(href)) else '' }}">{{ label }}</a>
    {% endfor %}
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
